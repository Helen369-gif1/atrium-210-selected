<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#21160d">
  <title>Атриум — обзор 210°</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #21160d; color: white; }
    #viewer { position: fixed; inset: 0; cursor: grab; touch-action: none; }
    #viewer:active { cursor: grabbing; }
    #viewer canvas { display: block; width: 100%; height: 100%; }
    .veil { position: fixed; inset: 0; pointer-events: none; background: linear-gradient(to bottom,rgba(22,13,6,.56),transparent 24%,transparent 69%,rgba(20,13,7,.64)); }
    .top { position: fixed; top: max(22px,env(safe-area-inset-top)); left: clamp(20px,4vw,60px); pointer-events: none; text-shadow: 0 1px 12px #321c08; }
    .eyebrow { color: #f3d7a6; font-size: 11px; letter-spacing: .19em; text-transform: uppercase; }
    h1 { margin: 7px 0 0; font: 400 clamp(29px,3.6vw,55px)/1.05 Georgia,serif; }
    .bottom { position: fixed; bottom: max(20px,env(safe-area-inset-bottom)); left: clamp(20px,4vw,60px); right: clamp(20px,4vw,60px); display:flex; align-items:center; justify-content:space-between; gap:15px; flex-wrap:wrap; }
    .left { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    button { appearance:none; border:1px solid rgba(255,226,182,.69); background:rgba(31,20,12,.73); backdrop-filter:blur(8px); color:white; border-radius:24px; padding:11px 17px; font-size:12px; cursor:pointer; }
    button:hover,button:focus-visible { background:rgba(112,69,29,.9); outline-color:#ffe2ae; }
    .hint { font-size:12px; color:#fff2dd; text-shadow:0 1px 9px #301b0b; }
    #error { position:fixed; inset:30% 15% auto; display:none; padding:20px; background:#21160d; border:1px solid #dbaa71; line-height:1.5; text-align:center; }
    @media(max-width:600px) { .hint { width:100%; order:2; } .bottom { justify-content:flex-start; } }
  </style>
</head>
<body>
  <div id="viewer" aria-label="Панорама атриума с ограниченным поворотом, поворачивайте мышью или пальцем"></div>
  <div class="veil"></div>
  <div class="top"><div class="eyebrow">Интерактивный обзор · 210°</div><h1>Атриум</h1></div>
  <div class="bottom">
    <div class="left"><button id="center" type="button">Вернуться к центру</button><button id="fullscreen" type="button">На весь экран</button></div>
    <span class="hint">Потяните мышкой или пальцем · обзор ограничен, чтобы сохранять композицию</span>
  </div>
  <div id="error" role="alert">Не удалось открыть 3D просмотр. Запустите index.html через Live Server в VS Code и обновите страницу.</div>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
